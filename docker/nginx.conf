server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Docker's internal resolver - re-resolves "app" hostname after container
        # restarts (Watchtower replaces the container, giving it a new IP; without
        # this nginx keeps the stale IP cached for the lifetime of the worker process)
        resolver 127.0.0.11 valid=10s;
        set $phpfpm "app:9000";
        fastcgi_pass $phpfpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;

        # During deploys PHP-FPM is briefly unavailable -> show auto-reload page
        fastcgi_intercept_errors on;
        error_page 502 503 = @deploying;
    }

    # Workbench look: paper, four-colour band, white card, dark mode from the
    # system setting. The fonts come from the public export this nginx serves;
    # the fallbacks carry the page while they are missing.
    location @deploying {
        add_header Retry-After 5 always;
        add_header Content-Type "text/html; charset=utf-8" always;
        return 503 "<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Einen Moment&hellip;</title><meta http-equiv='refresh' content='5'><style>@font-face{font-family:Anton;src:url('/fonts/werkbank/anton-400.woff2') format('woff2');font-display:swap}@font-face{font-family:'Atkinson Hyperlegible';src:url('/fonts/werkbank/atkinson-400.woff2') format('woff2');font-display:swap}:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;background:#f2f0eb;color:#5e5b55;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}body:before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ee318a 0 25%,#1dc3f3 25% 50%,#bfd535 50% 75%,#fed329 75% 100%)}div{max-width:380px;padding:28px 32px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px #e3e0d8,0 8px 28px rgba(17,17,17,.16);text-align:center}h1{margin:0 0 8px;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.03em;text-transform:uppercase;color:#111111}p{margin:0;font-size:14px}@media (prefers-color-scheme:dark){body{background:#0b0b0c;color:#a3a097}div{background:#141415;box-shadow:0 0 0 1px #2a2a2d,0 10px 30px rgba(0,0,0,.6)}h1{color:#ffffff}}</style></head><body><div><h1>Wird aktualisiert&hellip;</h1><p>Die Seite l&auml;dt automatisch nach.</p></div></body></html>";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
