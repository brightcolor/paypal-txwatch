name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      # Composer's package cache, keyed on the lock file. THE BIGGEST LEVER
      # AGAINST THE 429s below: with a warm cache almost nothing is fetched from
      # codeload at all, so the run neither trips the rate limit nor waits on it.
      # restore-keys lets a changed lock file still reuse the previous cache and
      # only fetch the delta.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # WHY THIS STEP HAS A FALLBACK: `--prefer-dist` pulls zipballs from
      # codeload.github.com, which GitHub throttles PER SOURCE IP - and hosted
      # runners share their egress addresses with everyone else's jobs, so a
      # build collects a "HTTP/2 429" without having done anything itself.
      # Measured on 2026-08-17: four runs in a row died mid-install.
      #
      # WHAT DOES NOT HELP, tried and discarded: handing Composer the workflow's
      # own GITHUB_TOKEN. That token is scoped to THIS repository, so it cannot
      # fetch zipballs of symfony, phpunit and the rest - Composer falls back to
      # codeload anyway and nothing changes. A personal access token in a secret
      # WOULD raise the limit (even one without scopes); this workflow
      # deliberately does not require one, so that a fork builds without extra
      # setup.
      #
      # So: fewer parallel downloads (the burst is what trips the abuse
      # detection), and if the dist install still fails, install from git
      # instead. Cloning is slower but is not subject to the same throttle - it
      # is what got this project's dependencies installed on the day the dist
      # path was unusable.
      - name: Install Composer dependencies
        env:
          COMPOSER_MAX_PARALLEL_HTTP: '6'
        run: |
          composer install --prefer-dist --no-interaction --no-progress \
            || {
              echo "::warning::dist-Download fehlgeschlagen (meist 429 von codeload) - weiche auf git aus"
              composer install --prefer-source --no-interaction --no-progress
            }

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
