name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      # Composer's package cache, keyed on the lock file. THE BIGGEST LEVER
      # AGAINST THE 429s below: with a warm cache almost nothing is fetched from
      # codeload at all, so the run neither trips the rate limit nor waits on it.
      # restore-keys lets a changed lock file still reuse the previous cache and
      # only fetch the delta.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # WHY THIS STEP EXISTS: `composer install --prefer-dist` pulls zipballs
      # from codeload.github.com, which GitHub rate-limits PER SOURCE IP and far
      # more strictly for unauthenticated requests. Hosted runners share their
      # egress addresses with everyone else's jobs, so a build can collect a
      # "HTTP/2 429" without having done anything itself - measured on
      # 2026-08-17, when three runs in a row died in the middle of the install.
      #
      # Two counter-measures, both cheap:
      #   - the token every workflow already has, so the download is no longer
      #     anonymous;
      #   - fewer parallel downloads (default is 12), because that burst is what
      #     trips the abuse detection in the first place.
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
          COMPOSER_MAX_PARALLEL_HTTP: '6'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
